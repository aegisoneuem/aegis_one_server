# buf configuration for the Aegis One agent <-> server contract.
#   buf lint      -> style + correctness checks
#   buf generate  -> Go code into ./gen (see buf.gen.yaml)
#   buf breaking --against '.git#branch=main'  -> fails if a change would break deployed agents
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # aegisone/v1/agent.proto mirrors the agent team's contract byte-for-byte
  # (names are pinned by the shipped agent), so only that file is exempt from
  # the naming rules it predates.
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - proto/aegisone/v1/agent.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/aegisone/v1/agent.proto
    SERVICE_SUFFIX:
      - proto/aegisone/v1/agent.proto
breaking:
  use:
    - WIRE_JSON
